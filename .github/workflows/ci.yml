    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - name: docker compose up -d --build (base + test overlay)
        run: >-
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.test.yml
          up -d --build

      # Замена невыдуманного `pnpm wait-on ...` (пакет не установлен, AGENTS.md §10) —
      # обычный опрос curl'ом, тот же таймаут (60s), что просил тикет.
      - name: Wait for api readiness (http://localhost:3000/ready)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ready >/dev/null; then
              echo "api ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "api did not become ready within 60s" >&2
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.test.yml logs api
          exit 1

      - name: pnpm db:seed
        env:
          DATABASE_URL: postgres://app_role:dorutj_dev_app_role_password@localhost:5432/dorutj
        run: pnpm db:seed

      - run: pnpm test:e2e

      - name: docker compose down -v
        if: always()
        run: >-
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.test.yml
          down -v

  # ---------------------------------------------------------------------------------------------
  # Job 7 — релиз, ТОЛЬКО по тегу vX.Y.Z, требует зелёных e2e+security-audit. Публикация образов
  # (push:true) требует секретов registry (DOCKER_REGISTRY/DOCKER_REGISTRY_USERNAME/
  # DOCKER_REGISTRY_TOKEN) — ОПЕРАЦИОННЫЙ шаг настройки вне этого YAML (тикет «Риски», владелец
  # репозитория настраивает GitHub Environments protection rule + секреты отдельно; без них этот
  # job ожидаемо красный на первом реальном прогоне — не дефект самого пайплайна).
  # ---------------------------------------------------------------------------------------------
  release-tag-only:
    name: release-tag-only
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e, security-audit]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - run: pnpm exec turbo run build --filter='./packages/*' --filter=@dorutj/api... --cache-dir=.turbo

      # Реально существующий скрипт (apps/api) — генерирует во временный файл и падает при
      # расхождении с закоммиченным docs/api/openapi.json (см. шапку файла, объяснение выбора
      # openapi:check вместо выдуманного `generate:openapi && git diff`).
      - run: pnpm --filter @dorutj/api openapi:check

      - uses: docker/setup-buildx-action@v3

      - name: Docker registry login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build & push release images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          target: runtime
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/dorutj-api:${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
