# DoruTJ — CI-пайплайн (DTJ-414, SRS-NFR-029/057/058/059/061/066).
# BARREL-файл (D-27, tickets/00-EPICS.md §«Порядок владения файлами») — правится ТОЛЬКО
# добавлением строк/job'ов, перечитать перед правкой, слияние конфликтов — за архитектором
# EP-19. Создан этим тикетом (первое касание файла), поэтому начальное наполнение — не
# «добавление строки» к существующему файлу.
#
# СЕМЬ JOB'ОВ (тикет «Технический контекст»):
#   typecheck-lint-arch → { unit-tests, integration-tests, security-audit } → build → e2e →
#   release-tag-only (только по тегу vX.Y.Z, требует зелёных e2e+security-audit).
#
# ВАЖНО — контракт vs факт (см. тикет, «Риски и подводные камни»): пайплайн вызывает ТОЛЬКО
# команды, реально существующие в package.json репозитория на момент написания (проверено
# `grep` по всем package.json перед реализацией). Тикет DTJ-414 в исходной формулировке называет
# несколько скриптов, которых в репозитории НЕТ (`test:unit`, `test:contracts`, `test:security`,
# `generate:openapi`, пакет `wait-on`) — АГЕНТ, ВЫПОЛНЯВШИЙ ЭТОТ ТИКЕТ, СОЗНАТЕЛЬНО НЕ СТАЛ ИХ
# ВЫДУМЫВАТЬ (AGENTS.md §11: «не можешь запустить проверку — это блокер, а не разрешение
# работать вслепую», §7: «не изобретай несуществующие API») и заменил их на реально
# существующие эквиваленты:
#   - `test:unit` (матрица по приложению)  → `pnpm turbo run test --filter=<app>` — это и есть
#     unit-скрипт каждого apps/* пакета (`"test": "vitest run"`), coverage уже включён внутри
#     каждого vitest.config.ts (`coverage.enabled: true`), отдельный флаг не нужен.
#   - `test:contracts`                     → НЕ вызывается — такого скрипта нет нигде в
#     репозитории и не отвечает ни одному существующему пакету; TODO(DTJ-416/будущий тикет
#     EP-19) — завести, когда появится реальный контрактный тест-сьют.
#   - `test:security`                      → НЕ вызывается — сьют ещё не существует (DTJ-425,
#     волна 3 EP-19, ещё не сделан на момент этого тикета). `security-audit` job ниже вызывает
#     ТОЛЬКО реально существующую `pnpm audit --audit-level=high`; шаг для `pnpm test:security`
#     оставлен закомментированным с явной ссылкой на тикет (AGENTS.md §15) — раскомментировать
#     в DTJ-425, не раньше.
#   - `pnpm generate:openapi`              → реальное имя скрипта в apps/api —
#     `openapi:generate`. Более того, `openapi:check` (тоже реальный скрипт, apps/api) уже
#     САМ генерирует спеку во временный файл и сравнивает с закоммиченной (см. его исходник,
#     `apps/api/src/common/openapi/openapi.scripts.ts`) — job `integration-tests` вызывает его
#     напрямую, отдельный `git diff --exit-code` не нужен, `openapi:check` уже возвращает
#     ненулевой код при расхождении.
#   - `pnpm wait-on ...`                   → пакет `wait-on` НЕ установлен нигде в репозитории
#     (ставить зависимость внутри тикета реализации запрещено, AGENTS.md §10) — заменено на
#     обычный bash-опрос `curl` в цикле с тем же таймаутом (60s), без новой зависимости.
#
# integration-tests использует НАТИВНЫЕ GitHub Actions `services:` (Postgres/Redis) — ДРУГОЙ
# механизм подъёма БД, чем `docker-compose.test.yml` (DTJ-413), который используется ТОЛЬКО
# стадией `e2e` (см. риск DTJ-413, не спутать два механизма).
#
# ГОТОВНОСТЬ ЗАВИСИМЫХ КОМАНД (тикет «Риски», ожидаемо для волны 1 EP-19, не дефект этого
# файла): `pnpm db:seed`, `pnpm --filter @dorutj/api openapi:check` и полный `docker compose up`
# зависят от кода EP-01/EP-04 и далее — сквозная зелёность всех job'ов наступит по мере
# готовности зависимых эпиков.

name: CI

on:
  push:
    branches: [main, development]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, development]

env:
  NODE_VERSION: '22.12'

jobs:
  # ---------------------------------------------------------------------------------------------
  # Job 1 — быстрый статический гейт (без БД). typecheck/lint/arch:check — реальные root-скрипты
  # package.json (НЕ единая `turbo run typecheck lint arch:check` — `lint`/`arch:check` не
  # зарегистрированы как turbo-таски в turbo.json, только `typecheck`/`test`/`build`; вызывать
  # несуществующую turbo-задачу значило бы выдумывать, AGENTS.md §11 — вызываем то, что реально
  # запускается). `test:arch` (тоже часть `pnpm verify`, тоже без БД — vitest над tests/arch/**)
  # добавлен в этот же job: он ловит именно те архитектурные нарушения/фикстуры-нарушители,
  # которые логически принадлежат этому «быстрому статическому» этапу, не unit/integration.
  #
  # lint/arch:check требуют СОБРАННЫХ packages/* (импорты `@dorutj/contracts` и т.п. резолвятся
  # только после `tsc`/`vite build` — проверено живым прогоном при реализации этого тикета:
  # `pnpm lint`/`pnpm arch:check` без предварительной сборки падают на неразрешённых импортах
  # рабочих пакетов) — отдельный шаг `turbo run build --filter='./packages/*'` ПЕРЕД ними.
  # ---------------------------------------------------------------------------------------------
  typecheck-lint-arch:
    name: typecheck / lint / arch:check / test:arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      # lint/arch:check резолвят @dorutj/* пакеты только после сборки — см. шапку job'а.
      - run: pnpm exec turbo run build --filter='./packages/*' --cache-dir=.turbo

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm arch:check
      - run: pnpm test:arch

  # ---------------------------------------------------------------------------------------------
  # Job 2 — unit-тесты, матрица по приложению (параллельные прогоны). `test` — реальный скрипт
  # КАЖДОГО apps/* package.json, coverage уже включён внутри vitest.config.ts каждого пакета
  # (`coverage.enabled: true`) — отдельный `--coverage` флаг не нужен (нет и в реальном скрипте).
  # ---------------------------------------------------------------------------------------------
  unit-tests:
    name: unit-tests (${{ matrix.name }})
    needs: typecheck-lint-arch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Каждый workspace-пакет со скриптом `test` — иначе его тесты в CI не выполняются вовсе
      # (apps/pharmacy и packages/* изначально не были в матрице).
      matrix:
        include:
          - { name: api, dir: apps/api }
          - { name: worker, dir: apps/worker }
          - { name: web, dir: apps/web }
          - { name: admin, dir: apps/admin }
          - { name: pharmacy, dir: apps/pharmacy }
          - { name: ui, dir: packages/ui }
          - { name: i18n, dir: packages/i18n }
          - { name: contracts, dir: packages/contracts }
          - { name: domain-kernel, dir: packages/domain-kernel }
          - { name: testing-kit, dir: packages/testing-kit }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      # apps/* импортируют packages/* — те же сборочные пакеты, что и job 1.
      - run: pnpm exec turbo run build --filter='./packages/*' --cache-dir=.turbo

      - run: pnpm exec turbo run test --filter=./${{ matrix.dir }} --cache-dir=.turbo

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.dir }}/coverage
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Job 3 — интеграционные тесты + инварианты + сверка openapi. Postgres/Redis — нативные
  # GitHub Actions `services:`, ИЗОЛИРОВАННЫЕ на джобу (TC-NFR-066: два параллельных PR получают
  # каждый СВОЙ контейнер сервиса — гарантия платформы GitHub Actions, не требует доп. настройки
  # с нашей стороны). `POSTGRES_USER: dorutj_migrator` — та же бутстрап-суперпользовательская
  # роль, что использует `docker-compose.yml` (DTJ-412): применению миграции `0031_app_role_
  # privileges.sql` нужны CREATEROLE/ALTER DEFAULT PRIVILEGES, которых нет у прикладной роли
  # `test` (см. postgres-init/01-test-database.sql — она NOSUPERUSER NOCREATEROLE) — миграции
  # ОБЯЗАНЫ идти под `dorutj_migrator`, прикладные интеграционные/инвариантные тесты — под `test`
  # (та же роль, что жёстко зашита дефолтом в apps/api/vitest.integration.config.ts и
  # tests/invariants/vitest.config.ts — `postgres://test:test@localhost:5432/dorutj_test`).
  # ---------------------------------------------------------------------------------------------
  integration-tests:
    name: integration-tests
    needs: typecheck-lint-arch
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dorutj_migrator
          # `dorutj_dev_only_password` — та же committed non-prod пара, что уже используется
          # секретом infra/docker/secrets/db_password.txt (Ж13) — НЕ произвольный новый CI-пароль:
          # несколько apps/api integration-спеков (`audit-log.controller.integration.spec.ts` и
          # др., см. grep по репозиторию перед реализацией, AGENTS.md §12) хардкодят ИМЕННО это
          # значение как fallback-дефолт для отдельного `migratorPool` (append-only audit_log
          # чистится/двигается только под dorutj_migrator) — другой пароль здесь ломает эти
          # тесты с `password authentication failed`, что и было живым прогоном обнаружено при
          # реализации этого тикета до того, как значение унифицировали.
          POSTGRES_PASSWORD: dorutj_dev_only_password
          POSTGRES_DB: dorutj
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dorutj_migrator -d dorutj"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - run: pnpm exec turbo run build --filter='./packages/*' --filter=@dorutj/api... --cache-dir=.turbo

      # `docker-entrypoint-initdb.d` НЕ применяется к нативным GH Actions `services:` (сервис
      # стартует ДО checkout'а этого шага) — воспроизводим тот же идемпотентный
      # postgres-init/01-test-database.sql (DTJ-412) вручную поверх уже поднятого сервиса.
      - name: Bootstrap test role/database (postgres-init/01-test-database.sql)
        env:
          PGPASSWORD: dorutj_dev_only_password
        run: psql -h localhost -U dorutj_migrator -d dorutj -f infra/docker/postgres-init/01-test-database.sql

      # Миграции — ролью dorutj_migrator (DDL-права), НАПРЯМУЮ в dorutj_test (см. шапку job'а).
      - name: Apply migrations to dorutj_test
        env:
          DATABASE_URL: postgres://dorutj_migrator:dorutj_dev_only_password@localhost:5432/dorutj_test
        run: pnpm db:migrate

      - name: apps/api — test:integration
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/dorutj_test
          REDIS_URL: redis://localhost:6379
        run: pnpm --filter @dorutj/api test:integration

      - name: tests/invariants — сквозные гейт-тесты доменных инвариантов
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/dorutj_test
          REDIS_URL: redis://localhost:6379
        run: pnpm test:invariants

      # Сверяет закоммиченный docs/api/openapi.json со сгенерированным заново — ненулевой код
      # при расхождении (см. её исходник, комментарий в шапке файла).
      - run: pnpm --filter @dorutj/api openapi:check

  # ---------------------------------------------------------------------------------------------
  # Job 4 — security-audit. `pnpm audit --audit-level=high` — реальная встроенная команда pnpm.
  # `pnpm test:security` НЕ вызывается — сьюта ещё нет в репозитории (DTJ-425, следующая волна
  # EP-19). TODO(DTJ-425): раскомментировать шаг ниже, когда сьют появится — до тех пор он не
  # часть этого гейта, чтобы не выдумывать несуществующую команду (AGENTS.md §11).
  # ---------------------------------------------------------------------------------------------
  security-audit:
    name: security-audit
    needs: typecheck-lint-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level=high

      # TODO(DTJ-425): раскомментировать, когда security test suite (SQLi/XSS/SSRF/CSRF/DoS/
      # rate-limit) реализован и скрипт `test:security` реально существует в package.json.
      # - run: pnpm test:security

  # ---------------------------------------------------------------------------------------------
  # Job 5 — сборка Docker-образов (проверка, что Dockerfile'ы из DTJ-412 реально собираются),
  # `push: false`. Матрица по приложению; api/worker используют Dockerfile.api (разные target),
  # web/admin — Dockerfile.web (ARG APP).
  # ---------------------------------------------------------------------------------------------
  build:
    name: build (${{ matrix.app }})
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: infra/docker/Dockerfile.api
            target: runtime
          - app: worker
            dockerfile: infra/docker/Dockerfile.api
            target: runtime-worker
          - app: web
            dockerfile: infra/docker/Dockerfile.web
            target: runtime
            build_arg_app: web
          - app: admin
            dockerfile: infra/docker/Dockerfile.web
            target: runtime
            build_arg_app: admin
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          build-args: |
            ${{ matrix.build_arg_app && format('APP={0}', matrix.build_arg_app) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ---------------------------------------------------------------------------------------------
  # Job 6 — e2e. Полный стек: docker-compose.yml (DTJ-412) + docker-compose.test.yml (DTJ-413).
  # `--build` пересобирает образы В ЭТОЙ джобе — образы job'а `build` (push:false) физически не
  # доступны в другом job'е/раннере без публикации в registry (GitHub Actions job'ы — отдельные
  # эфемерные машины); `needs: build` здесь про ПОРЯДОК гейта (Dockerfile'ы уже подтверждены
  # собираемыми), не про переиспользование конкретных слоёв — Docker layer cache (`cache-from:
  # type=gha` в job'е build) частично ускоряет и этот пересбор через тот же GHA cache backend.
  #
  # JWT_PRIVATE_KEY/JWT_PUBLIC_KEY — БЕЗ дефолта в docker-compose.yml (SRS-NFR-053, fail-fast) —
  # api не поднимется без них. Пара — ТА ЖЕ committed non-prod тестовая RSA-пара, что уже
  # используется tests/invariants/vitest.config.ts (Ж13, заведомо непроизводственная, коммитить
  # можно). DTJ-417 закрывает TODO, ранее висевший здесь («централизовать эту пару в одном
  # месте, когда каркас E2E заводит свои fixtures»): пара теперь ОДИН РАЗ хранится в
  # `tests/e2e/fixtures/test-jwt-{private,public}-key.pem` (третье место дублирования — не
  # четвёртое: `apps/api/test/.../test-app.ts` и `tests/invariants/vitest.config.ts` — TS-файлы,
  # инлайн-константа им нужна на этапе импорта модуля, YAML не может их заменить без нового
  # шага чтения файла в каждом из них — вне владения/объёма этого тикета) — первый шаг ниже
  # грузит их в `$GITHUB_ENV`, а не хардкодит PEM повторно в самом YAML.
  # ---------------------------------------------------------------------------------------------
  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # DTJ-417: единственное место хранения committed non-prod JWT-пары для тестового
      # окружения (см. комментарий job'а выше) — многострочные значения в $GITHUB_ENV требуют
      # heredoc-разделителя (документированный синтаксис Actions), не обычного `>>`.
      - name: Load test JWT keypair (non-prod, tests/e2e/fixtures/test-jwt-*-key.pem)
        run: |
          { echo "JWT_PRIVATE_KEY<<JWT_PRIVATE_KEY_EOF"; cat tests/e2e/fixtures/test-jwt-private-key.pem; echo "JWT_PRIVATE_KEY_EOF"; } >> "$GITHUB_ENV"
          { echo "JWT_PUBLIC_KEY<<JWT_PUBLIC_KEY_EOF"; cat tests/e2e/fixtures/test-jwt-public-key.pem; echo "JWT_PUBLIC_KEY_EOF"; } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: docker compose up -d --build (base + test overlay)
        run: >-
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.test.yml
          up -d --build

      # Замена невыдуманного `pnpm wait-on ...` (пакет не установлен, AGENTS.md §10) —
      # обычный опрос curl'ом, тот же таймаут (60s), что просил тикет.
      - name: Wait for api readiness (http://localhost:3000/ready)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ready >/dev/null; then
              echo "api ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "api did not become ready within 60s" >&2
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.test.yml logs api
          exit 1

      - name: pnpm db:seed
        env:
          DATABASE_URL: postgres://app_role:dorutj_dev_app_role_password@localhost:5432/dorutj
        run: pnpm db:seed

      - run: pnpm test:e2e

      # DTJ-417: живой smoke-прогон каркаса против уже поднятого выше стека (GET /health,
      # GET /ready) — НЕ CUJ-сценарий (те — DTJ-418..423, вне объёма этого тикета), см. JSDoc
      # tests/e2e/smoke/api-health.pw.spec.ts. Отдельным шагом (не частью `pnpm test:e2e`) —
      # `test:smoke` требует живой `E2E_REQUIRE_API=true` стек и НЕ должен запускаться в
      # `pnpm verify`/`pnpm test:e2e` на машине без докера (DoD DTJ-417).
      - run: pnpm --filter @dorutj/e2e test:smoke

      - name: docker compose down -v
        if: always()
        run: >-
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.test.yml
          down -v

  # ---------------------------------------------------------------------------------------------
  # Job 7 — релиз, ТОЛЬКО по тегу vX.Y.Z, требует зелёных e2e+security-audit. Публикация образов
  # (push:true) требует секретов registry (DOCKER_REGISTRY/DOCKER_REGISTRY_USERNAME/
  # DOCKER_REGISTRY_TOKEN) — ОПЕРАЦИОННЫЙ шаг настройки вне этого YAML (тикет «Риски», владелец
  # репозитория настраивает GitHub Environments protection rule + секреты отдельно; без них этот
  # job ожидаемо красный на первом реальном прогоне — не дефект самого пайплайна).
  # ---------------------------------------------------------------------------------------------
  release-tag-only:
    name: release-tag-only
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e, security-audit]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - run: pnpm exec turbo run build --filter='./packages/*' --filter=@dorutj/api... --cache-dir=.turbo

      # Реально существующий скрипт (apps/api) — генерирует во временный файл и падает при
      # расхождении с закоммиченным docs/api/openapi.json (см. шапку файла, объяснение выбора
      # openapi:check вместо выдуманного `generate:openapi && git diff`).
      - run: pnpm --filter @dorutj/api openapi:check

      - uses: docker/setup-buildx-action@v3

      - name: Docker registry login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build & push release images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          target: runtime
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/dorutj-api:${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
