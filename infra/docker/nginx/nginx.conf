# DoruTJ — граничный (edge) Nginx: TLS-терминация + грубая маршрутизация API vs статика.
# DTJ-412, SRS-NFR-051/052. Монтируется НЕПОСРЕДСТВЕННО в контейнер `nginx:1.27-alpine`
# сервиса `nginx` в docker-compose.yml (без отдельного Dockerfile.nginx — вне files_owned
# этого тикета) как /etc/nginx/nginx.conf.
#
# Важно: маршрутизация ТЕНАНТОВ (какой бренд/домен) НЕ делается здесь. Единственный
# server-блок в conf.d/00-gateway.conf — catch-all для ЛЮБОГО Host
# (`server_name ~^(?<tenant_host>.+)$`), резолвинг тенанта происходит ВНУТРИ apps/api через
# TenantResolutionMiddleware (SRS-API-065) — новый White-Label домен подключается через
# админку, без редеплоя Nginx. Здесь — только: (1) TLS, (2) грубый лимит запросов по IP
# (первый рубеж; точный лимит по userId/phone — на уровне @fastify/rate-limit в apps/api,
# этот Nginx-лимит его НЕ заменяет), (3) какой upstream — apps/api или статика SPA.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $host [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # --- Грубый rate-limit по IP (SRS-NFR-052 п.1) — defense-in-depth, не замена ---
    # --- точечных лимитов apps/api (по userId/phone/pharmacyId). ---
    limit_req_zone $binary_remote_addr zone=anon_global:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_otp:10m rate=10r/m;

    # WebSocket upgrade (SRS-API-052 realtime-канал).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_upstream {
        server api:3000;
    }

    upstream web_upstream {
        server web:80;
    }

    upstream admin_upstream {
        server admin:80;
    }

    include /etc/nginx/conf.d/*.conf;
}
