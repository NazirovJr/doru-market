# DoruTJ — граничный catch-all сервер (DTJ-412, SRS-NFR-051).
#
# Слушает ТОЛЬКО порт 80 (plain HTTP) — сознательное решение ДЛЯ ЭТОГО ТИКЕТА:
# критерий приёмки №2 (`curl http://localhost/api/v1/health` → 200 OK без флагов вроде -k)
# должен работать на «чистой машине» БЕЗ предварительно сгенерированных TLS-сертификатов —
# `docker-compose.prod.yml` не добавляет и не может добавить новый server-блок Nginx (override
# в Compose меняет только настройки СЕРВИСА — образ/порты/ресурсы/реплики, не содержимое
# смонтированных конфигов). Полностью готовый TLS-блок (SRS-NFR-051, вкл. HTTP→HTTPS редирект,
# ACME-challenge для certbot, WS-проксирование `/api/v1/realtime`) лежит рядом в
# `conf.d/01-tls.conf.disabled` — при развёртывании с реальными сертификатами (prod, после
# первого `certbot certonly`) переименовать в `01-tls.conf` (подхватывается `include
# /etc/nginx/conf.d/*.conf` без пересборки образа, только `nginx -s reload`).
#
# `depends_on: [api, web, admin]` сервиса `nginx` в docker-compose.yml — про порядок старта
# (не стартовать edge раньше бэкендов), а не про то, что каждый backend уже маршрутизируется
# отсюда: `admin_upstream` (nginx.conf) зарезервирован под follow-up тикет, который выберет
# схему маршрутизации кабинета (поддомен vs путь) при появлении apps/admin.

server {
    listen 80 default_server;
    server_name ~^(?<tenant_host>.+)$;

    # ACME HTTP-01 challenge — не используется, пока certbot (`profiles: ["prod"]`) не включён,
    # но безопасно держать всегда: не конфликтует ни с чем на порту 80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Realtime WebSocket-канал (SRS-API-052) — отдельный location: свой proxy_read_timeout,
    # без limit_req (устойчивое соединение, не «запрос в минуту»).
    location /api/v1/realtime {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # дольше WS_HEARTBEAT_INTERVAL_MS (25s) с запасом на джиттер
    }

    # OTP-эндпоинты — доп. рубеж вокруг брутфорса (defense-in-depth поверх SRS-API-019/022).
    location /api/v1/auth/otp/ {
        limit_req zone=auth_otp burst=5 nodelay;
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Остальной API — грубый общий лимит по IP (SRS-NFR-052 п.1).
    location /api/ {
        limit_req zone=anon_global burst=20 nodelay;
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;              # читается TenantResolutionMiddleware (SRS-API-065)
        proxy_set_header X-Real-IP $remote_addr;   # используется @fastify/rate-limit в apps/api
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное — статика покупательского SPA (apps/web).
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
