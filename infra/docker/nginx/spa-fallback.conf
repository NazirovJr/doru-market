# DoruTJ — конфиг статики SPA для React Router v7 (client-side routing).
# Копируется Dockerfile.web в /etc/nginx/conf.d/default.conf внутри КАЖДОГО образа
# web/admin/pharmacy/courier (DTJ-412, SRS-NFR-050) — это внутренний Nginx конкретного
# SPA-контейнера, НЕ путать с граничным Nginx (infra/docker/nginx/nginx.conf), который
# проксирует трафик СНАРУЖИ на этот контейнер.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Любой путь, не найденный на диске как файл/директория, отдаёт index.html —
    # React Router v7 сам разбирает маршрут на клиенте (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статические ассеты со сборочным хэшем в имени — безопасно кэшировать долго.
    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
